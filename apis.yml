aid: cloud-academy
name: Cloud Academy
description: >-
  Cloud Academy is a hands-on technology skills training platform, now operating as the QA
  Learning Platform (cloudacademy.com redirects to platform.qa.com). It combines self-paced
  course content with hands-on labs, learning paths, quizzes, and exams across cloud, security,
  and software disciplines. Its public REST API lets enterprise administrators integrate the
  platform with internal business systems — browsing the content catalog, managing organization
  teams and members, and generating asynchronous reports on learner activity, progress, and
  skills. Authentication is OAuth2 client-credentials and the public API is rate-limited to 100
  requests per minute. Cloud Academy was surfaced as a 500 Global portfolio company and enriched
  into the API Evangelist network from its live Swagger definition.
