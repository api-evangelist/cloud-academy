                        type: string
                      links:
                        title: links
                        type: object
                        properties:
                          self:
                            title: schema
                            type: string
                            format: uri
                      type:
                        title: type
                        type: string
                        example: team
        '503':
          description: Service unavailable.
          content:
            body:
              example:
                errors:
                - detail: The service is temporary unavailable. Please try again later.
                  source:
                    pointer: /data
                  status: '503'
      tags:
