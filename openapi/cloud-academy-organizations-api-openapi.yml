  /v1/organizations/accounts/teams/{id}/members/:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    get:
      operationId: v1_organizations_accounts_teams_members_read
      summary: List members of a team
      description: '## Description


        This endpoint returns the list of members of the specified team.


        ## Sorting

        It''s possible to sort on the following fields:


        * role

        * first_name

        * last_name

        * email


        By default results are ordered in ascending order, for descending descending put a ''-'' before the field.'
      parameters:
      - name: sort
        in: query
        description: Which field to use when ordering the results.
        required: false
        schema:
          type: string
      - name: page[number]
        in: query
        description: A page number within the paginated result set.
        required: false
        schema:
          type: integer
      - name: page[size]
        in: query
        description: Number of results to return per page.
        required: false
        schema:
          type: integer
      responses:
        '200':
          description: ''
          content:
            application/vnd.api+json:
              schema:
                title: body
                required:
                - data
                type: object
                properties:
                  data:
                    title: data
                    type: array
                    items:
                      required:
                      - attributes
                      - type
                      - id
                      type: object
                      properties:
                        attributes:
                          title: attributes
                          required: []
                          type: object
                          properties:
                            email:
                              title: email
                              type: string
                              format: email
                            first_name:
                              title: first_name
                              type: string
                            job_role:
                              title: job_role
                              type: string
                            last_name:
                              title: last_name
                              type: string
                            role:
                              title: role
                              type: string
                            user_id:
                              title: user_id
                              type: string
                        id:
                          title: id
                          type: string
                        type:
                          title: type
                          type: string
                          example: team_membership
                  links:
                    title: links
                    type: object
                    properties:
                      first:
                        title: first
                        type: string
                        format: uri
                      last:
                        title: last
                        type: string
                        format: uri
                      next:
                        title: next
                        type: string
                        format: uri
                      prev:
                        title: prev
                        type: string
                        format: uri
                  meta:
                    title: meta
                    type: object
                    properties:
                      pagination:
                        title: pagination
                        type: object
                        properties:
                          count:
                            title: count
                            type: integer
                            format: int32
                          page:
                            title: page
                            type: integer
                            format: int32
                          pages:
                            title: pages
                            type: integer
                            format: int32
        '401':
          description: Executing the request without credentials.
          content:
            body:
              example:
                errors:
                - detail: Authentication credentials were not provided.
                  source:
                    pointer: /data
                  status: '401'
        '404':
          description: Team not found
          content:
            body:
              example:
                errors:
                - detail: 'Invalid team_id id: {id} - '
                  source:
                    pointer: /data
                  status: '404'
        '500':
          description: Internal server error.
          content:
            body:
              example:
                errors:
                - detail: Internal server error.
                  source:
                    pointer: /data
                  status: '500'
        '503':
          description: Service unavailable.
          content:
            body:
              example:
                errors:
                - detail: The service is temporary unavailable. Please try again later.
                  source:
                    pointer: /data
                  status: '503'
      tags:
      - Organizations
    post:
      operationId: v1_organizations_accounts_teams_members_create
      summary: Add members to a team
      description: '## Description


        This endpoint adds member to a specific team of the company

        Given a list of basic member information (emails, first name and last name), for each entity:


        * it adds the members to the team if he/she is already a member the company.

        * it creates a new member and add he/she to the team if there isn''t already a member with the same email in the company.


        All user created will have ''Member'' as role.


        In case of errors, like wrong email or missing data, all request is discarded and no member is created.


        This endpoint accepts only one request per minute. See the responses for more information.'
      responses:
        '500':
          description: Internal server error.
          content:
            body:
              example:
                errors:
                - detail: Internal server error.
                  source:
                    pointer: /data
                  status: '500'
        '201':
          description: Members created
          content:
            application/vnd.api+json:
              schema:
                title: body
                required:
                - data
                type: object
                properties:
                  data:
                    title: data
                    required:
                    - attributes
                    - type
                    - id
                    type: object
                    properties:
                      attributes:
                        title: attributes
                        required: []
                        type: object
                        properties:
                          general_error:
                            title: general_error
                            type: string
                          members:
                            type: array
                            items:
                              required: []
                              type: object
                              properties:
                                email:
                                  title: email
                                  type: string
                                  format: email
                                error:
                                  title: error
                                  type: boolean
                                first_name:
                                  title: first_name
                                  type: string
                                is_success:
                                  title: is_success
                                  type: boolean
                                last_name:
                                  title: last_name
                                  type: string
                      id:
                        title: id
                        type: string
                      type:
                        title: type
                        type: string
                        example: bulk_member_import
        '429':
          description: '429: Too many requests. Your client is sending too many requests at once. Check the retry-after header for the number of seconds to wait between calls to this endpoint.'
          content:
            body:
              example:
                errors:
                - detail: Too many requests.
                  source:
                    pointer: /data
                  status: '429'
        '400':
          description: ''
          content:
            body:
              example:
                errors:
                - detail:
                    email: user@email.com
                    error: error-message
                  source:
                    pointer: /data
                  status: '400'
        '401':
          description: Executing the request without credentials.
          content:
            body:
              example:
                errors:
                - detail: Authentication credentials were not provided.
                  source:
                    pointer: /data
                  status: '401'
        '404':
          description: Team not found
          content:
            body:
              example:
                errors:
                - detail: 'Invalid team_id id: {id} - '
                  source:
                    pointer: /data
                  status: '404'
        '503':
          description: Service unavailable.
          content:
            body:
              example:
                errors:
                - detail: The service is temporary unavailable. Please try again later.
                  source:
                    pointer: /data
                  status: '503'
        '409':
          description: Missing JSON-API type attribute.
          content:
            body:
              example:
                errors:
                - detail: The resource object's type (None) is not the type that constitute the collection represented by the endpoint (bulk_member_import).
                  source:
                    pointer: /data
                  status: '409'
      tags:
      - Organizations
      requestBody:
        content:
          application/vnd.api+json:
            schema:
              title: body
              required:
              - data
              type: object
              properties:
                data:
                  title: data
                  required:
                  - attributes
                  - type
                  type: object
                  properties:
                    attributes:
                      title: attributes
                      required:
                      - members
                      type: object
                      properties:
                        members:
                          type: array
                          items:
                            required:
                            - email
                            - first_name
                            - last_name
                            type: object
                            properties:
                              email:
                                title: email
                                type: string
                                format: email
                              first_name:
                                title: first_name
                                type: string
                              last_name:
                                title: last_name
                                type: string
                    type:
                      title: type
                      type: string
                      example: bulk_member_import
        required: true
    delete:
      operationId: v1_organizations_accounts_teams_members_delete
      summary: Remove members from a team
      description: '## Description


        This endpoint removes members from a specific team of the company in a single operation.

        Given a list of emails, it removes all members from a specific team of the company.


        In case of errors, like wrong email or already deleted members, the request is discarded and no member is deleted.'
      responses:
        '400':
          description: Bad request, incorrect email address or the user does not belong to this team.
          content:
            body:
              example:
                errors:
                - detail: 'invalid-member-deletion: user@email.com'
                  source:
                    pointer: /data
                  status: '400'
        '401':
          description: Executing the request without credentials.
          content:
            body:
              example:
                errors:
                - detail: Authentication credentials were not provided.
                  source:
