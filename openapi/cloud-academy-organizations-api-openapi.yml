                      type: array
                      items:
                        required:
                        - email
                        - first_name
                        - last_name
                        type: object
                        properties:
                          email:
                            title: email
                            type: string
                            format: email
                          first_name:
                            title: first_name
                            type: string
                          last_name:
                            title: last_name
                            type: string
                type:
