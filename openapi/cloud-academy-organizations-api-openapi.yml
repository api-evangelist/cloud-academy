                    type: object
                    properties:
                      first:
                        title: first
                        type: string
                        format: uri
                      last:
                        title: last
                        type: string
                        format: uri
                      next:
                        title: next
                        type: string
                        format: uri
                      prev:
                        title: prev
                        type: string
                        format: uri
                  meta:
                    title: meta
                    type: object
                    properties:
                      pagination:
