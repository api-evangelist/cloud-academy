                            email:
                              title: email
                              type: string
                              format: email
                            error:
                              title: error
                              type: boolean
                            first_name:
                              title: first_name
                              type: string
                            is_success:
                              title: is_success
                              type: boolean
                            last_name:
                              title: last_name
                              type: string
                  id:
                    title: id
                    type: string
                  type:
