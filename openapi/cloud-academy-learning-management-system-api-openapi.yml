openapi: 3.2.0
info:
  title: QA Learning Management System API
  description: '## Keys for QA API


    QA uses API keys to authenticate calls to its API.'
  version: v1
servers:
- url: https://platform.qa.com/restapi
security:
- oauth2: []
tags:
- name: Learning Management System
paths:
  /v1/content/catalog/:
    parameters: []
    get:
      operationId: v1_content_catalog_list
      summary: Access the QA Platform content catalog, with pagination [DEPRECATED]
      description: '## Description

        This API returns a catalog of the items in the QA Platform library, including the custom content your company created in Content Engine.

        This API is deprecated: please use /v2/content/catalog/ instead.'
      parameters:
      - name: page[number]
        in: query
        description: A page number within the paginated result set.
        required: false
        schema:
          type: integer
      - name: page[size]
        in: query
        description: Number of results to return per page.
        required: false
        schema:
          type: integer
      - name: filter[content_type]
        in: query
        description: '[Optional] A comma-separated list of content types to limit the returned catalog.

          Here the possible values:

          - lp

          - course

          - quiz

          - exam

          - resource

          - lab

          - labchallenge



          e.g.: https://...&filter[content_type]=course,labchallenge'
        schema:
          type: string
      - name: additional_fields
        in: query
        description: '[Optional] A comma-separated list of additional fields that can be shown in the catalog.

          Please note: using these parameters can affect performances.

          Here the possible values:

          - description: represents the full description of the content

          - skills: this will includes information about platforms and skills related to the content


          e.g.: https://...&additional_fields=skills,description'
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/vnd.api+json:
              schema:
                title: body
                required:
                - data
                type: object
                properties:
                  data:
                    title: data
                    type: array
                    items:
                      required:
                      - attributes
                      - type
                      - id
                      type: object
                      properties:
                        attributes:
                          title: attributes
                          required: []
                          type: object
                          properties:
                            items:
                              title: items
                              type: array
                              items:
                                type: object
                                properties:
                                  content_type:
                                    title: content_type
                                    type: string
                                  content_type_label:
                                    title: content_type_label
                                    type: string
                                  description:
                                    title: description
                                    type: string
                                  difficulty_level:
                                    title: difficulty_level
                                    type: string
                                  duration:
                                    title: duration
                                    type: number
                                  entity_id:
                                    title: entity_id
                                    type: string
                                  platforms:
                                    title: platforms
                                    type: array
                                    items:
                                      type: object
                                      properties:
                                        id:
                                          title: id
                                          type: number
                                        name:
                                          title: name
                                          type: string
                                  publish_date:
                                    title: publish_date
                                    type: string
                                    format: date-time
                                  short_description:
                                    title: short_description
                                    type: string
                                  skills:
                                    title: skills
                                    type: array
                                    items:
                                      type: object
                                      properties:
                                        id:
                                          title: id
                                          type: number
                                        name:
                                          title: name
                                          type: string
                                        slug:
                                          title: slug
                                          type: string
                                  title:
                                    title: title
                                    type: string
                                  url:
                                    title: url
                                    type: string
                        id:
                          title: id
                          type: string
                        links:
                          title: links
                          type: object
                          properties:
                            self:
                              title: schema
                              type: string
                              format: uri
                        type:
                          title: type
                          type: string
                          example: catalog
                  links:
                    title: links
                    type: object
                    properties:
                      first:
                        title: first
                        type: string
                        format: uri
                      last:
                        title: last
                        type: string
                        format: uri
                      next:
                        title: next
                        type: string
                        format: uri
                      prev:
                        title: prev
                        type: string
                        format: uri
                  meta:
                    title: meta
                    type: object
                    properties:
                      pagination:
                        title: pagination
                        type: object
                        properties:
                          count:
                            title: count
                            type: integer
                            format: int32
                          page:
                            title: page
                            type: integer
                            format: int32
                          pages:
                            title: pages
                            type: integer
                            format: int32
        '401':
          description: Executing the request without credentials.
          content:
            body:
              example:
                errors:
                - detail: Authentication credentials were not provided.
                  source:
                    pointer: /data
                  status: '401'
        '404':
          description: Catalog not found
          content:
            body:
              example:
                errors:
                - detail: Searched catalog does not exist
                  source:
                    pointer: /data
                  status: '404'
        '500':
          description: Internal server error.
          content:
            body:
              example:
                errors:
                - detail: Internal server error.
                  source:
                    pointer: /data
                  status: '500'
        '503':
          description: Service unavailable.
          content:
            body:
              example:
                errors:
                - detail: The service is temporary unavailable. Please try again later.
                  source:
                    pointer: /data
                  status: '503'
      tags:
      - Learning Management System
