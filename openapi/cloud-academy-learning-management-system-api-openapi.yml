  /v2/user/progress/:
    parameters: []
    get:
      operationId: v2_user_progress_list
      summary: Show the progress of the currently logged in user [DEPRECATED]
      description: '## Description

        This endpoint is a simplified version of the */user/{user_id}/progress*

        that retrieves the progress for the currently logged in user.

        Note: Please bear in mind that the data retrieved is updated every hour and not in real time.

        This API is deprecated: please use /v3/user/progress/ instead.'
      parameters:
      - name: sort
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page[number]
        in: query
        description: A page number within the paginated result set.
        required: false
        schema:
          type: integer
      - name: page[size]
        in: query
        description: Number of results to return per page.
        required: false
        schema:
          type: integer
      - name: filter[progress]
        in: query
        schema:
          type: integer
      - name: filter[progress__lt]
        in: query
        schema:
          type: integer
      - name: filter[progress__lte]
        in: query
        schema:
          type: integer
      - name: filter[progress__gt]
        in: query
        schema:
          type: integer
