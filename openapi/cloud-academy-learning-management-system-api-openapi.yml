                          entity_id:
                            title: entity_id
                            type: string
                          platforms:
                            title: platforms
                            type: array
                            items:
                              type: object
                              properties:
                                id:
                                  title: id
                                  type: number
                                name:
                                  title: name
                                  type: string
                          publish_date:
                            title: publish_date
                            type: string
                            format: date-time
                          short_description:
                            title: short_description
                            type: string
                          skills:
                            title: skills
                            type: array
                            items:
                              type: object
                              properties:
                                id:
                                  title: id
                                  type: number
                                name:
