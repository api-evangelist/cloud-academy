          Here the possible values:

          - lp

          - course

          - quiz

          - exam

          - resource

          - lab

          - labchallenge



          e.g.: https://...&filter[content_type]=course,labchallenge'
        type: string
      - name: additional_fields
        in: query
        description: '[Optional] A comma-separated list of additional fields that can be shown in the catalog.

          Please note: using these parameters can affect performances.

          Here the possible values:

          - description: represents the full description of the content

          - skills: this will includes information about platforms and skills related to the content


          e.g.: https://...&additional_fields=skills,description'
        type: string
      responses:
        '200':
          description: ''
          schema:
            title: body
            required:
            - data
            type: object
            properties:
              data:
                title: data
                type: array
                items:
                  required:
                  - attributes
                  - type
                  - id
                  type: object
                  properties:
                    attributes:
                      title: attributes
                      required: []
                      type: object
                      properties:
                        items:
                          title: items
                          type: array
                          items:
                            type: object
                            properties:
                              content_type:
                                title: content_type
                                type: string
                              content_type_label:
                                title: content_type_label
                                type: string
                              description:
                                title: description
                                type: string
                              difficulty_level:
                                title: difficulty_level
                                type: string
                              duration:
                                title: duration
                                type: number
                              entity_id:
                                title: entity_id
                                type: string
                              platforms:
                                title: platforms
                                type: array
                                items:
                                  type: object
                                  properties:
                                    id:
                                      title: id
                                      type: number
                                    name:
                                      title: name
                                      type: string
                              publish_date:
                                title: publish_date
                                type: string
                                format: date-time
                              short_description:
                                title: short_description
                                type: string
                              skills:
                                title: skills
                                type: array
                                items:
                                  type: object
                                  properties:
                                    id:
                                      title: id
                                      type: number
                                    name:
                                      title: name
                                      type: string
                                    slug:
                                      title: slug
                                      type: string
                              title:
                                title: title
                                type: string
                              url:
                                title: url
                                type: string
                    id:
                      title: id
                      type: string
                    links:
                      title: links
                      type: object
                      properties:
                        self:
                          title: schema
                          type: string
                          format: uri
                    type:
                      title: type
                      type: string
                      example: catalog
              links:
                title: links
                type: object
                properties:
                  first:
                    title: first
                    type: string
                    format: uri
                  last:
                    title: last
                    type: string
                    format: uri
                  next:
                    title: next
                    type: string
                    format: uri
                  prev:
                    title: prev
                    type: string
                    format: uri
              meta:
                title: meta
                type: object
                properties:
                  pagination:
                    title: pagination
                    type: object
                    properties:
                      count:
                        title: count
                        type: integer
                        format: int32
                      page:
                        title: page
                        type: integer
                        format: int32
                      pages:
                        title: pages
                        type: integer
                        format: int32
        '401':
          description: Executing the request without credentials.
          examples:
            body:
              errors:
              - detail: Authentication credentials were not provided.
                source:
                  pointer: /data
                status: '401'
        '404':
          description: Catalog not found
          examples:
            body:
              errors:
              - detail: Searched catalog does not exist
                source:
                  pointer: /data
                status: '404'
        '500':
          description: Internal server error.
          examples:
            body:
              errors:
              - detail: Internal server error.
                source:
                  pointer: /data
                status: '500'
        '503':
          description: Service unavailable.
          examples:
            body:
              errors:
              - detail: The service is temporary unavailable. Please try again later.
                source:
                  pointer: /data
                status: '503'
      consumes:
      - application/vnd.api+json
      produces:
      - application/vnd.api+json
      tags:
      - Learning Management System
