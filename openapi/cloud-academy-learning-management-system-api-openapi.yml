                              type: string
                              format: email
                            first_name:
                              title: first_name
                              type: string
                            last_name:
                              title: last_name
                              type: string
                        id:
                          title: id
                          type: string
                        links:
                          title: links
                          type: object
                          properties:
                            self:
                              title: schema
                              type: string
                              format: uri
                        type:
                          title: type
                          type: string
                          example: company_membership_progress
                  links:
                    title: links
                    type: object
                    properties:
                      first:
                        title: first
                        type: string
                        format: uri
                      last:
                        title: last
                        type: string
                        format: uri
                      next:
                        title: next
                        type: string
                        format: uri
                      prev:
                        title: prev
                        type: string
                        format: uri
                  meta:
                    title: meta
                    type: object
                    properties:
                      pagination:
                        title: pagination
                        type: object
                        properties:
                          count:
                            title: count
