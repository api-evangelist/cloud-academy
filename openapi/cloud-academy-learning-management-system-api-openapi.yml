  /v2/company/progress/:
    parameters: []
    get:
      operationId: v2_company_progress_list
      summary: Retrieve content progress for your organization member by member
      description: '## Description

        This API will return a list of the members of the company with a link with their own progress.

        The API does not apply any default pagination. Thus, `links` and `meta` keys in the response are optional and will appear only if a pagination is explicitly applied.

        Note: Please bear in mind that the data retrieved is updated every hour and not in real time.'
      parameters:
      - name: filter[first_name]
        in: query
        description: ''
        required: false
        schema:
          type: string
      - name: filter[first_name__in]
        in: query
        description: Multiple values may be separated by commas.
        required: false
        schema:
          type: string
      - name: filter[last_name]
        in: query
        description: ''
        required: false
        schema:
          type: string
      - name: filter[last_name__in]
        in: query
        description: Multiple values may be separated by commas.
        required: false
        schema:
          type: string
      - name: filter[email]
        in: query
        description: ''
        required: false
        schema:
          type: string
      - name: filter[email__in]
        in: query
        description: Multiple values may be separated by commas.
        required: false
        schema:
          type: string
      - name: sort
        in: query
        description: Which field to use when ordering the results.
        required: false
        schema:
          type: string
      - name: page[number]
        in: query
        description: A page number within the paginated result set.
        required: false
        schema:
          type: integer
      - name: page[size]
        in: query
        description: Number of results to return per page.
        required: false
        schema:
          type: integer
      responses:
