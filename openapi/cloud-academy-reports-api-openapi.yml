                                title: field_names
                                type: object
                                properties:
                                  field_name:
                                    title: field_name
                                    type: object
                                    properties:
                                      format:
                                        title: format
                                        type: string
                                      required:
                                        title: required
                                        type: boolean
                                      type:
                                        title: type
                                        type: string
                              id:
                                title: id
                                type: string
                              type:
                                title: type
                                type: string
                        name:
                          title: name
                          type: string
                        report_type:
                          title: report_type
                          type: string
                        template:
                          title: template
                          type: array
                          items:
                            type: object
                            properties:
                              data:
                                title: data
                                type: object
                                properties:
                                  attributes:
                                    title: attributes
                                    type: object
                                    properties:
                                      filters:
                                        title: filters
                                        type: object
                                      report_type:
                                        title: report_type
                                        type: string
                                  type:
                                    title: type
                                    type: string
