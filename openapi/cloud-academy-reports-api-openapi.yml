                                    title: data
                                    type: object
                                    properties:
                                      attributes:
                                        title: attributes
                                        type: object
                                        properties:
                                          filters:
                                            title: filters
                                            type: object
                                          report_type:
                                            title: report_type
                                            type: string
                                      type:
                                        title: type
                                        type: string
