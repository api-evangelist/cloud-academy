    post:
      operationId: v1_reports_custom-reports_create
      summary: Triggers the generation of a custom report
      description: '## Description


        This endpoint triggers the generation of a custom report and returns information about the triggered report-generation job.


        This request can be made once per user per 10-minute interval. The same user calling this endpoint more than once in 10 minutes receives an HTTP 429 TOO_MANY_REQUESTS response along with a Retry-After header. This header includes how long you must wait before sending another request.


        To see a payload example, you can call the same endpoint with the GET method. With the GET method, the request retrieves the list of available custom reports. The "template" field contains a list of the components of the request payload you can use to format the report data.'
      responses:
        '201':
          description: Jobs Properly Generated
